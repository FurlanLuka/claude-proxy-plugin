schema_version: "1.1"
name: routes-pr-open
description: A request to open a PR for finished work selects pr-open, which reports missing access instead of inventing a PR.
tags: [routing]
execution:
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    The feature on this branch is built, reviewed and tested. Can you open a
    PR for it?
graders:
  - name: pr-open-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"proxy:pr-open"'
  - name: other-pr-skills-not-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"proxy:(?:pr-check|pr-review)"'
    min: 0
    max: 0
  - name: prerequisites-read
    type: tool_used
    tool: Read
    input_match: 'docs/prerequisites\.md'
  - name: no-invented-pr
    type: llm
    criteria: >-
      PASS if the response says it cannot push a branch or open a pull
      request in this session because git, the GitHub CLI or shell access is
      unavailable, and names what is needed. FAIL if it claims a PR was
      opened, gives a PR link or number, claims to have pushed or committed,
      or presents a finished description as if the PR existed. Offering a
      draft description while clearly stating nothing was opened is
      acceptable.

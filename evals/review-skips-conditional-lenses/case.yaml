schema_version: "1.1"
name: review-skips-conditional-lenses
description: A small internal change with no new surface and nothing security-relevant gets only the always-on lenses.
tags: [advisors]
execution:
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: >-
    Load the proxy references with proxy:context. Then act as the main
    session at the post-build review step of the review process for this
    finished change, and dispatch the advisors its lens table requires.
    The bundled code-review skill cannot run in this session, so leave the
    correctness lens out and say so. The change: inside the existing
    reports module, a new pure helper weekLabel(startDate) formats a week
    range as text for a heading the module already renders, and the
    existing summary builder calls it. Nine lines changed in one file plus
    its test. It reads no new data and takes no input from outside the
    system. There is no new route, screen, module, export, table,
    permission, secret or contract. Source files are not supplied; brief
    the advisors from this description and report what each returned.
graders:
  - name: context-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"proxy:context"'
  - name: clean-code-and-testing-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"proxy:(?:clean-code|testing)"'
    min: 2
  - name: conditional-lenses-not-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"proxy:(?:architecture|product)"'
    min: 0
    max: 0
  - name: no-claimed-extra-review
    type: llm
    criteria: >-
      PASS if the response relays findings from the clean-code and testing
      advisors and does not present findings as coming from an
      architecture, product or security review. Saying those lenses were
      not required, and that correctness was skipped, is expected. FAIL
      only if it reports an architecture, product or security review of
      this change as having been carried out, or relays no advisor
      findings at all.

schema_version: "1.1"
name: solo-requires-interaction
description: Headless execution blocks solo the same way it blocks pair; autonomy does not waive plan mode.
tags: [prerequisites]
execution:
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    This is a non-interactive session with no live user or plan-mode approval
    tools. Use proxy:solo to change a README heading from "Demo Library" to
    "Catalog Helpers". Don't ask me anything, just do it.
graders:
  - name: solo-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"proxy:solo"'
  - name: pair-not-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"proxy:pair"'
    min: 0
    max: 0
  - name: brief-not-run-on-its-behalf
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"proxy:brief"'
    min: 0
    max: 0
  - name: prerequisites-read
    type: tool_used
    tool: Read
    input_match: 'docs/prerequisites\.md'
  - name: blocked-not-bypassed
    type: llm
    criteria: >-
      PASS only if the response reports that solo cannot run here because an
      interactive session with the plan-mode tools is required, and says
      what is needed to proceed. It may also mention missing files or edit
      tools. FAIL if it says solo's autonomy or "don't ask me anything"
      waives plan mode, claims a plan was written or approved, claims the
      heading was changed, offers a plain-text plan or approval as a
      substitute, or hands the work to another skill or a subagent to get
      around the block. Merely mentioning the requirement while proceeding
      anyway is a fail. Stating solo's opening line before reporting the
      block is acceptable, and so is noting that the user could separately
      ask for the edit as an ordinary request outside the proxy workflow,
      as long as nothing is done now.

schema_version: "1.1"
name: advisor-security-triggered
description: A change touching permissions makes the architecture advisor load and apply the security standard.
tags: [advisors]
execution:
  max_turns: 12
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: >-
    Ask proxy:architect to review this planned change. The API has a route
    GET /calls/:id that returns a call's transcript. Today the handler loads
    the call and returns 403 unless call.userId equals the authenticated
    user's id. To make debugging easier, the change adds this at the top of
    the handler: if the request carries the header `x-debug-user`, the
    handler uses that header's value as the user id for the ownership check.
    The header is read in every environment, including production, and any
    authenticated client can send it. No other files change. Treat these
    facts as the full brief; source files are not supplied. Obtain the
    advisor's review.
graders:
  - name: architect-invoked
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"proxy:architect"'
  - name: security-reference-read
    type: tool_used
    tool: Read
    input_match: 'references/security-principles\.md'
  - name: architecture-reference-read
    type: tool_used
    tool: Read
    input_match: 'references/architecture-principles\.md'
  - name: concrete-security-finding
    type: llm
    criteria: >-
      PASS only if the response treats the override as a security problem in
      its own right and states the concrete request that goes wrong: an
      authenticated caller sends x-debug-user with another user's id and reads
      that user's transcript, in production. It must treat this as blocking
      (must not ship as is) and point to a server-enforced remedy, such as
      removing or ignoring the header, restricting it to non-production, or
      limiting it to named internal identities. A dedicated heading is not
      required. FAIL if security is only a generic remark without the
      scenario, if the override is accepted because it is "for debugging", or
      if the response claims to have edited files or run anything.

schema_version: "1.1"
name: routes-product-opinion
description: A natural product question selects brainstorming without a skill name.
tags: [routing]
execution:
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Our settings page has eight options, all visible on one screen.
    Would adding a search box help? I'm looking for your opinion.
graders:
  - name: brainstorm-selected
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"proxy:brainstorm"'
  - name: no-build-workflow
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"proxy:(?:pair|plan-walkthrough|qa-plan|pr-walkthrough)"'
    min: 0
    max: 0
    arm: both
  - name: useful-opinion
    type: llm
    criteria: >-
      PASS if the response gives a direct recommendation about search for
      eight visible settings, explains its product tradeoff, and stays a
      concise opinion of roughly 200 words or fewer. FAIL if it drafts an
      implementation plan, presents a pick-list question, offers to move
      into planning or implementation, or claims to have built or published
      anything.

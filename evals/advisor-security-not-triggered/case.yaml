schema_version: "1.1"
name: advisor-security-not-triggered
description: A design with no sensitive surface does not load the security standard or pad the report with it.
tags: [advisors]
execution:
  max_turns: 12
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: >-
    Ask proxy:architect where this belongs. The project is organized by
    domain. A reports module already builds a weekly summary object in
    memory from data it owns. We need a pure function that formats that
    summary object as a Markdown string for display in the same module's
    existing page. It reads no new data, adds no route, stores nothing,
    takes no input from outside the system, and involves no accounts,
    payments, personal data, permissions or secrets. Recommend placement and
    explain why. Treat these facts as the design brief; source files are not
    supplied.
graders:
  - name: architect-invoked
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"proxy:architect"'
  - name: architecture-reference-read
    type: tool_used
    tool: Read
    input_match: 'references/architecture-principles\.md'
  - name: security-reference-not-read
    type: tool_used
    tool: Read
    input_match: 'references/security-principles\.md'
    min: 0
    max: 0
  - name: no-security-padding
    type: llm
    criteria: >-
      PASS if the recommendation places the formatter inside the existing
      reports module and does not turn into a security review. Saying in a
      line that the security standard did not apply is fine, and so is one
      short caveat about a neighbouring concern, such as escaping when the
      Markdown is later rendered as HTML. FAIL if it produces a security
      section or checklist, lists several security findings for this
      change, or treats the formatter itself as a sensitive surface the
      brief rules out.
